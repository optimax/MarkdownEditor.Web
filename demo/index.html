<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown Editor</title>
<style>
  :root { --bg: #eef0f3; --ink: #1f2328; --muted: #57606a; --line: #d0d7de; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  header label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
  header button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff;
    cursor: pointer; }
  main { flex: 1; min-height: 0; padding: 0 16px 8px; }
  #editor { height: 100%; width:80%; margin: 0 auto;}
  footer { padding: 0 16px 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Markdown Editor</h1>
  <button id="download">Download .md</button>
</header>
<main>
  <div id="editor"></div>
</main>
<footer id="status"></footer>
<script type="module">
  import { MarkdownEditor, DEFAULT_TOOLBAR } from '../src/index.js';

  // The page's own buttons in the editor's toolbar, after the editor's: collapsible headings, the dark theme and
  // read-only, each a switch. (The raw Markdown view is the editor's own button, and Ctrl+Shift+R.)
  const outlineButton = {
    name: 'outline', title: 'Collapsible headings', pressed: (editor) => editor.showOutline,
    icon: '<path d="m4 6 3 3 3-3"/><path d="M13 7h7"/><path d="m5 14 3 3-3 3"/><path d="M13 17h7"/>',
    onClick: (editor) => (editor.showOutline = !editor.showOutline),
  };
  let dark = false;
  const darkButton = {
    name: 'dark', title: 'Dark theme', pressed: () => dark,
    icon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
    onClick: (editor) => {
      dark = !dark;
      editor.theme = dark ? 'dark' : 'light';
      document.body.style.setProperty('--bg', dark ? '#151618' : '#eef0f3');
      document.body.style.setProperty('--ink', dark ? '#e6e6e6' : '#1f2328');
    },
  };
  const readOnlyButton = {
    name: 'readonly', title: 'Read-only', pressed: (editor) => editor.readOnly,
    icon: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    onClick: (editor) => (editor.readOnly = !editor.readOnly),
  };

  const sample = await fetch('sample.md').then((response) => response.text());
  const editor = new MarkdownEditor('#editor', {
    markdown: sample, imageBase: new URL('./', location.href).href,
    toolbar: [...DEFAULT_TOOLBAR, '|', outlineButton, darkButton, readOnlyButton],
  });
  window.editor = editor;
  editor.focus();

  const status = document.getElementById('status');
  let savedVersion = editor.version;
  const refresh = () => {
    const words = editor.value.split(/\s+/).filter(Boolean).length;
    const where = editor.paragraphNumber ? `paragraph ${editor.paragraphNumber} · ` : '';
    status.textContent = `${where}${editor.blockType} · ${words} words${editor.version !== savedVersion ? ' · edited' : ''}`;
  };
  editor.addEventListener('change', refresh);
  editor.addEventListener('selectionchange', refresh);
  editor.addEventListener('modechange', refresh);
  refresh();

  document.getElementById('download').addEventListener('click', () => {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([editor.value], { type: 'text/markdown' }));
    link.download = 'document.md';
    link.click();
    savedVersion = editor.version;
    refresh();
  });
</script>
</body>
</html>
